[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-facilities-manager"
version = "0.2.0"
description = "Operations API for critical facilities: location hierarchy, asset inventory, maintenance orders, and an append-only audit trail."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NishikawaButterfly" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy==2.3.0",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfm = [
  "py.typed",
  "migrations/script.py.mako",
  "migrations/versions/*.py",
  # The web frontend ships inside the package: no build step produces it, so
  # the files in the tree are the files that get served.
  "web/*.css",
  "web/*.html",
  "web/*.js",
  "web/*.json",
  "web/views/*.js",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = ["ANN401", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"scripts/**/*.py" = ["T201"]
# Schema DDL in migration scripts is long by nature.
"src/cfm/migrations/versions/*.py" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cfm"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cfm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
