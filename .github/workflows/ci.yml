name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Run tests with coverage
        # The gate sits just under the measured 97.36% (branch coverage)
        # so real regressions fail while incidental line shuffling does
        # not. Local runs skip coverage to stay fast; this is the only
        # place the threshold lives.
        run: python -m pytest --cov=cfm --cov-fail-under=96

      - name: Migration chain against a fresh database
        env:
          CFM_DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  postgres:
    name: PostgreSQL (migrations and full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Pinned to the major version the sibling deployment stack runs
        # (electrical-asset-validator ships postgres:16-alpine in its
        # compose file): this job exists to catch dialect problems on the
        # PostgreSQL we would actually deploy against, not the newest one
        # available. 16 also satisfies every floor the code states —
        # plpgsql statement triggers need 11+, and the per-test
        # DROP DATABASE WITH (FORCE) in tests/conftest.py needs 13+.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cfm
          POSTGRES_USER: cfm
          POSTGRES_PASSWORD: cfm-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfm -d cfm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        # One interpreter is enough here: the Quality matrix already
        # covers both supported Pythons, and this job isolates the
        # database axis instead.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Migration chain against PostgreSQL
        # The first real execution of every PostgreSQL branch in the
        # migration scripts — including the 0004 append-only trigger DDL
        # (function, triggers, and their downgrade), which the SQLite
        # jobs can never reach.
        env:
          CFM_DATABASE_URL: postgresql+psycopg://cfm:cfm-ci-only@127.0.0.1:5432/cfm
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run the full test suite against PostgreSQL
        # Every test on the shared database_url fixture gets its own
        # freshly created PostgreSQL database (see tests/conftest.py) —
        # including the append-only tests, so this job is where the 0004
        # plpgsql triggers are proven to exist and to fire. The
        # migration-chain tests build their own SQLite URLs by design and
        # run here unchanged.
        env:
          CFM_TEST_DATABASE_URL: postgresql+psycopg://cfm:cfm-ci-only@127.0.0.1:5432/cfm
        run: python -m pytest
