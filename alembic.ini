# Alembic configuration for the Critical Facilities Manager.
#
# There is deliberately no sqlalchemy.url entry: the migration environment
# resolves the database URL through cfm.config.Settings, the same source the
# application uses (CFM_DATABASE_URL, an optional .env file, or the SQLite
# default). Alembic commands therefore always target the database the
# application would serve.

[alembic]
script_location = src/cfm/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
